### Path to the PDB file for the structure to analyze
pdbpath: '../data/1BF5/WT/1BF5_WT.pdb'

### Does the structure contain DNA?
dna: True

### Does the structure contain phosphorylated amino acids?
phos: True

### At which pH should the protein be protonated?
protonation:
  method: propka
  ph: 7.4
  decision_mode: manual
  review_pka_window: 1.0
  acknowledge_phospho_approximation: false
  overrides: []


### Replicates to analyze
repn: [1, 2]

### Custom AMBER force fields to use (if any)
# ffs: [water.opc, protein.ff19SB]

### Custom MD simulation parameters
# em: 'myscripts/em.mdp'
# nvt: 'myscripts/nvt.mdp'
# npt: 'myscripts/npt.mdp'
# md: 'myscripts/md.mdp'

### Duration of the MD production simulation in ps (overwrites md.mdp)
### 1 ns = 1000 ps
# md_time: 100000

### MD computational resource use
# ntmpi: "2"
# ntomp: "16"
# ngpu: "1"
# gputasks: '01'
# nb: gpu
# pme: gpu
# npme: "1"

##### SNAKEMAKE ANALYSIS PARAMETERS #####
### Number of cores to use for Snakemake analysis
snakecores: 12

### Hydrogen bond analysis methods
methods_hbonds: [mda, gmx]

### Structure(s) to analyze
structure: [1BF5]

### Mutation(s) to analyze
muts: [WT, E411A]

### Interaction groups for interaction analysis
# These can be chain IDs (e.g., "A", "B", "C") or predefined groups (e.g., "Protein", "DNA")
group1: Protein
group2: DNA

### Frames for interaction analysis. If not specified, all frames will be analyzed.
start_frame: 1000
# stop_frame: 2001

### Chain groups, for example for RMSF plotting. Each group is a list of chain IDs.
chaingroups:
  Protein: [A, B]
  DNA: [C, D]

### Domains for annotation and plot coloring
# First level keys are group names (e.g., "Protein", "DNA") and should match chaingroups keys.
# Each domain is defined by a start and end residue number, a color, and a label.
# Domains for the same chaingroup should not overlap, but can be adjacent.
domains:
  Protein:
    - start: 540
      end: 580
      color: blue
      label: Domain1
    - start: 581
      end: 600
      color: red
      label: Domain2
  DNA:
    - start: 1
      end: 12
      color: green
      label: DNA_Domain1
    - start: 13
      end: 24
      color: orange
      label: DNA_Domain2


