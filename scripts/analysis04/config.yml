# Parameters to pass to the Snakefile

# Hydrogen bond analysis methods
methods_hbonds:
  - gmx
  - mda

# Structures to analyze
structure:
  - A
  - B
  - C

# Mutations to analyze
muts:
  - X
  - Y
  - Z

# Replicates
reps:
  - rep1
  - rep2
  - rep3

# data directory
datadir: "data"

# snakemake script directory
scriptdir: "scripts/analysis04/scripts"

# DNA in complex?
dna: true

# Phosphate groups in complex?
phosphate: true

# Offset for residue numbering (default: 0)
offset: 135

# Protein domain definitions
domains:
  - start: 137
    end: 317
    color: blue
    label: CCD
  - start: 318
    end: 488
    color: red
    label: DBD
  - start: 489
    end: 576
    color: green
    label: LD
  - start: 577
    end: 683
    color: yellow
    label: SH2
  - start: 684
    end: 708
    color: pink
    label: Tail
  